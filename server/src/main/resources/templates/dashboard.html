<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>장치 · OTA Platform</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script defer th:src="@{/js/admin-dashboard.js}"></script>
</head>
<body>
<a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
<div class="admin-shell">
    <aside class="sidebar">
        <a class="sidebar-brand" th:href="@{/admin}" aria-label="OTA Platform 홈">
            <span class="brand-mark" aria-hidden="true">O</span>
            <span>OTA Platform</span>
        </a>
        <nav class="sidebar-nav" aria-label="관리 메뉴">
            <p class="nav-section-label">Management</p>
            <a class="nav-item" th:href="@{/admin}" aria-current="page">
                <svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true">
                    <rect x="2.5" y="3" width="15" height="11" rx="1.5"
                          fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M6 17h8M8 14v3m4-3v3M6 7h2m2 0h4M6 10h5"
                          fill="none" stroke="currentColor" stroke-width="1.5"
                          stroke-linecap="round"/>
                </svg>
                <span class="nav-text">장치</span>
            </a>
            <a class="nav-item" th:href="${hawkbitUiUrl}"
               target="_blank" rel="noopener">
                <svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true">
                    <path d="M3 5.5h14v10H3zM6 3h8v2.5M6 9h8m-8 3h5"
                          fill="none" stroke="currentColor" stroke-width="1.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="nav-text">Firmware</span>
                <span class="nav-external" aria-hidden="true">↗</span>
            </a>
        </nav>
    </aside>
    <div class="app-main">
        <header class="topbar">
            <div class="breadcrumbs" aria-label="현재 위치">
                <span aria-current="page">장치</span>
            </div>
            <div class="topbar-actions">
                <a class="button button-secondary" th:href="${hawkbitUiUrl}"
                   target="_blank" rel="noopener">Firmware</a>
                <button class="button" type="button"
                        data-open-device-dialog>장치 추가</button>
            </div>
        </header>
        <main class="workspace" id="main-content">
            <div class="page-heading">
                <div class="page-title-group">
                    <h1 class="page-title">
                        장치 <span class="count" th:text="${totalDevices}">0</span>
                    </h1>
                </div>
            </div>
            <div class="fleet-summary" aria-label="장치 요약">
                <div class="summary-item">
                    전체 <strong th:text="${totalDevices}">0</strong>
                </div>
                <div class="summary-item">
                    온라인 <strong th:text="${onlineDevices}">0</strong>
                </div>
                <div class="summary-item">
                    오프라인 <strong th:text="${offlineDevices}">0</strong>
                </div>
                <div class="summary-item">
                    PSK 설정 <strong th:text="${credentialReadyDevices}">0</strong>
                </div>
            </div>
            <section class="surface" aria-labelledby="device-list-title">
                <h2 id="device-list-title" hidden>장치 목록</h2>
                <div class="table-toolbar" th:hidden="${#lists.isEmpty(devices)}">
                    <label class="search-field">
                        <span hidden>장치 검색</span>
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M11.2 10.3 15 14.1l-.9.9-3.8-3.8a6 6 0 1 1 .9-.9ZM6.5 11.2a4.7 4.7 0 1 0 0-9.4 4.7 4.7 0 0 0 0 9.4Z"
                                  fill="currentColor"/>
                        </svg>
                        <input id="device-search" type="search" autocomplete="off"
                               placeholder="장치 이름 또는 endpoint">
                    </label>
                    <div class="toolbar-actions">
                        <div class="filter-group" aria-label="장치 상태 필터">
                            <button class="filter-button" type="button"
                                    data-filter="all" aria-pressed="true">전체</button>
                            <button class="filter-button" type="button"
                                    data-filter="online" aria-pressed="false">온라인</button>
                            <button class="filter-button" type="button"
                                    data-filter="offline" aria-pressed="false">오프라인</button>
                            <button class="filter-button" type="button"
                                    data-filter="credential" aria-pressed="false">PSK 필요</button>
                        </div>
                        <p class="result-count" id="device-result-count"
                           aria-live="polite">
                            <span th:text="${totalDevices}">0</span>개
                        </p>
                    </div>
                </div>
                <div class="table-scroll" th:unless="${#lists.isEmpty(devices)}">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th class="column-name" scope="col">장치 이름</th>
                            <th class="column-endpoint" scope="col">Endpoint</th>
                            <th class="column-state" scope="col">연결</th>
                            <th class="column-state" scope="col">Credential</th>
                            <th class="column-state" scope="col">상태</th>
                            <th class="column-action" scope="col"><span hidden>상세</span></th>
                        </tr>
                        </thead>
                        <tbody id="device-table-body">
                        <tr th:each="device : ${devices}"
                            th:attr="data-name=${device.displayName != null
                                    ? device.displayName : device.endpoint},
                                    data-endpoint=${device.endpoint},
                                    data-online=${device.online},
                                    data-credential=${device.credentialProvisioned}">
                            <td>
                                <a class="device-link"
                                   th:href="@{/admin/devices/{endpoint}
                                           (endpoint=${device.endpoint})}"
                                   th:text="${device.displayName != null
                                           ? device.displayName : device.endpoint}">
                                    Device
                                </a>
                            </td>
                            <td class="mono muted" th:text="${device.endpoint}">endpoint</td>
                            <td>
                                <span class="status"
                                      th:classappend="${device.online
                                              ? 'status-online status-strong' : ''}"
                                      th:text="${device.online ? 'Online' : 'Offline'}">
                                    Offline
                                </span>
                            </td>
                            <td>
                                <span class="status"
                                      th:classappend="${device.credentialProvisioned
                                              ? 'status-online' : ''}"
                                      th:text="${device.credentialProvisioned
                                              ? 'Ready' : 'Required'}">
                                    Required
                                </span>
                            </td>
                            <td>
                                <span class="status"
                                      th:classappend="${device.enabled ? 'status-online' : ''}"
                                      th:text="${device.enabled ? 'Enabled' : 'Disabled'}">
                                    Enabled
                                </span>
                            </td>
                            <td class="column-action">
                                <a class="row-link"
                                   th:href="@{/admin/devices/{endpoint}
                                           (endpoint=${device.endpoint})}"
                                   th:aria-label="|${device.endpoint} 상세 열기|">
                                    <span aria-hidden="true">›</span>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="empty-state" th:if="${#lists.isEmpty(devices)}">
                    <strong>등록된 장치가 없습니다.</strong>
                    <button class="button" type="button"
                            data-open-device-dialog>장치 추가</button>
                </div>
                <div class="empty-state" id="device-no-results" hidden>
                    <strong>검색 결과가 없습니다.</strong>
                    <button class="button button-secondary"
                            id="device-filter-reset" type="button">필터 초기화</button>
                </div>
            </section>
        </main>
    </div>
</div>
<dialog class="dialog" id="device-create-dialog" aria-labelledby="device-dialog-title">
    <form id="device-create-form">
        <header class="dialog-header">
            <h2 id="device-dialog-title">장치 추가</h2>
            <button class="icon-button" type="button"
                    data-close-device-dialog aria-label="닫기">×</button>
        </header>
        <div class="dialog-body">
            <label class="form-field">
                <span>Endpoint</span>
                <input class="text-input" id="endpoint" maxlength="255"
                       autocomplete="off" placeholder="stm32-f429zi-02" required>
            </label>
            <label class="form-field">
                <span>표시 이름 <small>(선택)</small></span>
                <input class="text-input" id="display-name" maxlength="255"
                       autocomplete="off" placeholder="개발실 BMS #2">
            </label>
            <p class="form-feedback" id="device-create-result"
               aria-live="polite"></p>
        </div>
        <footer class="dialog-footer">
            <button class="button button-secondary" type="button"
                    data-close-device-dialog>취소</button>
            <button class="button" type="submit">추가</button>
        </footer>
    </form>
</dialog>
</body>
</html>
